<header>
  <a class="brand" [routerLink]="auth.user() ? '/account' : '/login'"><span aria-hidden="true">✳</span> Nutritional Expert</a>
  <nav aria-label="Navigazione principale">
    @if (auth.user()) {
      <a routerLink="/account">Il mio account</a>
      <button type="button" (click)="auth.logout()">Esci</button>
    } @else {
      <a routerLink="/login">Accedi</a>
      <a class="nav-register" routerLink="/registrazione">Registrati</a>
    }
  </nav>
</header>
<main><router-outlet /></main>
<footer>Nutritional Expert <span>Il tuo percorso verso il benessere.</span></footer>
