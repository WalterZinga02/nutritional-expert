# Configurazione backend: connessione PostgreSQL e segreto JWT tramite variabili d’ambiente.
# Flyway applica le migrazioni; Hibernate verifica lo schema senza modificarlo.
# open-in-view=false richiede di leggere le relazioni JPA durante le transazioni del service.
# Gli istanti sono gestiti in UTC; il JWT ha durata PT30M (30 minuti).
spring.application.name=nutritional-expert-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nutritional_expert}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

server.error.include-message=never
server.error.include-stacktrace=never

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=nutritional-expert
app.jwt.ttl=PT30M
