# Configurazione dei test: database H2 in memoria ricreato a ogni contesto e chiave JWT solo di prova.
# Flyway è disabilitato qui; per i test PostgreSQL si sovrascrivono datasource, Flyway e ddl-auto da Maven.
spring.datasource.url=jdbc:h2:mem:auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
app.jwt.secret=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
app.jwt.issuer=nutritional-expert
app.jwt.ttl=PT30M
debug=false
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO
